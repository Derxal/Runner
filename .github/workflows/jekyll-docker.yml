name: Mi Servidor

on:
  push:
    branches: [ "main" ]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - name: Copiar mis arcrivos al contenedor
      uses: actions/checkout@v4
    
    - name: instalar node
      uses: actions/setup-node@v7

    - name: Saludar
      run: echo Hola mundo

    - name: instalar librerias
      run: npm ci

    - name: Testing
      run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: contruicción de los archivos
        run: sleep 5

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar archivos
        run: sleep 5